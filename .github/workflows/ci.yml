name: Tast API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task_db
          POSTGRES_USER: tast_user
          POSTGRES_PASSWORD: task_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/task_db
          SPRING_DATASOURCE_USERNAME: tast_user
          SPRING_DATASOURCE_PASSWORD: task_password
